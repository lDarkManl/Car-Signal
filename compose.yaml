services:
  rabbitmq:
    image: rabbitmq:4-management

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq

  car-management:
    build:
      context: .
      dockerfile: Dockerfile.car_management
    depends_on:
      - rabbitmq

  monitore:
    build:
      context: .
      dockerfile: Dockerfile.monitore
    depends_on:
      - rabbitmq


